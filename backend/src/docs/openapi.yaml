openapi: 3.0.3
info:
  title: SGEC — API
  version: 1.0.0
  description: |
    API do **SGEC — Sistema de Gestão de Espaços Compartilhados** (ABADEUS / UNESC).

    **Módulo 1 — Autenticação e Segurança** · responsável: **Lucas de Oliveira**

    Para testar as rotas protegidas, faça login em `POST /auth/login` aqui mesmo:
    o navegador guarda o cookie `sgec_sessao` e passa a enviá-lo nas outras rotas.
servers:
  - url: /api
tags:
  - name: Sistema
    description: Saúde da API.
  - name: Autenticação
    description: Módulo 1 — Lucas de Oliveira. Cadastro, login, sessão, perfil e senhas.
  - name: Usuários
    description: Módulo 1 — Lucas de Oliveira. Gestão de contas (somente ADMIN).
  - name: Espaços
    description: Módulo 2 — Samuel. Espaços e horários de funcionamento.

paths:
  /saude:
    get:
      tags: [Sistema]
      summary: Verifica se a API e o banco estão no ar
      responses:
        '200':
          description: API e banco funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  usuario_banco: { type: string, example: sgec_app }
                  horario: { type: string, format: date-time }

  /auth/registro:
    post:
      tags: [Autenticação]
      summary: Cria uma conta pública (sempre com perfil SOLICITANTE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaConta' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Entra no sistema e grava o cookie de sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email, example: admin@sgec.local }
                senha: { type: string, format: password }
      responses:
        '200':
          description: Login feito. O token vai só no cookie `sgec_sessao`, nunca no corpo.
          headers:
            Set-Cookie:
              schema: { type: string, example: sgec_sessao=...; Path=/api; HttpOnly; SameSite=Strict }
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario: { $ref: '#/components/schemas/Usuario' }
                  sessaoExpiraEm: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '429':
          description: Muitas tentativas erradas (LOGIN_BLOQUEADO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Sai deste aparelho (funciona mesmo com a sessão expirada)
      responses:
        '204': { description: Sessão encerrada }

  /auth/logout-todos:
    post:
      tags: [Autenticação]
      summary: Sai de todos os aparelhos
      security: [{ sessao: [] }]
      responses:
        '204': { description: Todas as sessões encerradas }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /auth/recuperar-senha:
    post:
      tags: [Autenticação]
      summary: Pede o link de "esqueci minha senha" (resposta sempre igual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Pedido recebido. Em desenvolvimento, o link aparece no log da API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem: { type: string }
        '400': { $ref: '#/components/responses/DadosInvalidos' }

  /auth/redefinir-senha:
    post:
      tags: [Autenticação]
      summary: Usa o link recebido para definir uma nova senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Senha redefinida; todas as sessões da conta foram encerradas }
        '400': { $ref: '#/components/responses/DadosInvalidos' }

  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Meus dados
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    patch:
      tags: [Autenticação]
      summary: Edita os meus dados (e os da minha empresa, se for pessoa jurídica)
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, minLength: 2, maxLength: 150 }
                cpf: { type: string, nullable: true, example: '52998224725' }
                telefone: { type: string, nullable: true, example: (48) 99999-0000 }
                empresa: { $ref: '#/components/schemas/EmpresaEditavel' }
      responses:
        '200':
          description: Dados atualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /auth/eu/senha:
    put:
      tags: [Autenticação]
      summary: Troca a minha senha (os outros aparelhos saem)
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senhaAtual, novaSenha]
              properties:
                senhaAtual: { type: string, format: password }
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Senha trocada; uma sessão nova foi aberta neste aparelho }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /auth/eu/sessoes:
    get:
      tags: [Autenticação]
      summary: Aparelhos conectados à minha conta
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Sessões ativas (`atual` marca este aparelho)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    ip: { type: string }
                    user_agent: { type: string }
                    criada_em: { type: string, format: date-time }
                    ultimo_acesso_em: { type: string, format: date-time }
                    expira_em: { type: string, format: date-time }
                    atual: { type: boolean }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista as contas com busca, filtros e paginação
      security: [{ sessao: [] }]
      parameters:
        - { name: busca, in: query, schema: { type: string }, description: 'Nome, e-mail ou empresa' }
        - { name: perfil, in: query, schema: { $ref: '#/components/schemas/Perfil' } }
        - { name: tipoPessoa, in: query, schema: { $ref: '#/components/schemas/TipoPessoa' } }
        - { name: ativo, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: porPagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  total: { type: integer }
                  pagina: { type: integer }
                  porPagina: { type: integer }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    post:
      tags: [Usuários]
      summary: Cria uma conta escolhendo o perfil (CNPJ já cadastrado é vinculado à empresa)
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NovaConta'
                - type: object
                  properties:
                    perfil: { $ref: '#/components/schemas/Perfil' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdUsuario'
    get:
      tags: [Usuários]
      summary: Uma conta
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Usuários]
      summary: Edita dados, perfil, situação e a empresa da conta
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, minLength: 2, maxLength: 150 }
                cpf: { type: string, nullable: true }
                telefone: { type: string, nullable: true }
                perfil: { $ref: '#/components/schemas/Perfil' }
                ativo: { type: boolean }
                empresa: { $ref: '#/components/schemas/EmpresaEditavel' }
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /usuarios/{id}/senha:
    parameters:
      - $ref: '#/components/parameters/IdUsuario'
    put:
      tags: [Usuários]
      summary: Define uma senha nova para a conta (as sessões dela são encerradas)
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [novaSenha]
              properties:
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Senha definida }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /espacos:
    get:
      tags: [Espaços]
      summary: Lista espaços com busca, tipo e paginação
      description: Quem não é da gestão só vê espaços ativos.
      security: [{ sessao: [] }]
      parameters:
        - { name: busca, in: query, schema: { type: string }, description: Nome do espaço }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoEspaco' } }
        - { name: ativo, in: query, schema: { type: string, enum: ['true', 'false'] }, description: Só a gestão }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: porPagina, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Espaco' }
                  total: { type: integer }
                  pagina: { type: integer }
                  porPagina: { type: integer }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
    post:
      tags: [Espaços]
      summary: Cadastra um espaço e a grade de funcionamento
      description: Administração e gestão. Dia sem horário fica fechado. 1 = segunda-feira, 7 = domingo.
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EspacoNovo' }
      responses:
        '201':
          description: Espaço criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Espaco' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/DadosInvalidos' }

  /espacos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdEspaco'
    get:
      tags: [Espaços]
      summary: Um espaço, com a grade de funcionamento
      security: [{ sessao: [] }]
      responses:
        '200':
          description: Espaço encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Espaco' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Espaços]
      summary: Edita dados, situação ou substitui a grade de funcionamento
      description: Se `horarios` vier no corpo, a grade ativa é trocada por essa lista.
      security: [{ sessao: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EspacoEditavel' }
      responses:
        '200':
          description: Espaço atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Espaco' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/DadosInvalidos' }

components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: sgec_sessao
      description: Cookie gravado pelo `POST /auth/login`.

  parameters:
    IdUsuario:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdEspaco:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Perfil:
      type: string
      enum: [ADMIN, GESTOR, RECEPCAO, SOLICITANTE]
    TipoEspaco:
      type: string
      enum: [COWORKING, LABORATORIO, SALA]
    HorarioFuncionamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        dia_semana: { type: integer, minimum: 1, maximum: 7, description: '1 = segunda-feira, 7 = domingo' }
        hora_inicio: { type: string, example: '08:00' }
        hora_fim: { type: string, example: '18:00' }
    HorarioEntrada:
      type: object
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana: { type: integer, minimum: 1, maximum: 7, description: '1 = segunda-feira, 7 = domingo' }
        horaInicio: { type: string, example: '08:00' }
        horaFim: { type: string, example: '18:00' }
    Espaco:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoEspaco' }
        capacidade: { type: integer }
        ativo: { type: boolean }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        horarios:
          type: array
          items: { $ref: '#/components/schemas/HorarioFuncionamento' }
    EspacoNovo:
      type: object
      required: [nome, tipo, capacidade, horarios]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120 }
        tipo: { $ref: '#/components/schemas/TipoEspaco' }
        capacidade: { type: integer, minimum: 1, maximum: 500 }
        horarios:
          type: array
          minItems: 1
          maxItems: 21
          items: { $ref: '#/components/schemas/HorarioEntrada' }
    EspacoEditavel:
      type: object
      properties:
        nome: { type: string, minLength: 2, maxLength: 120 }
        tipo: { $ref: '#/components/schemas/TipoEspaco' }
        capacidade: { type: integer, minimum: 1, maximum: 500 }
        ativo: { type: boolean }
        horarios:
          type: array
          minItems: 1
          maxItems: 21
          items: { $ref: '#/components/schemas/HorarioEntrada' }
    TipoPessoa:
      type: string
      enum: [FISICA, JURIDICA]
    Empresa:
      type: object
      properties:
        id: { type: string, format: uuid }
        cnpj: { type: string, example: '11222333000181' }
        razao_social: { type: string }
        nome_fantasia: { type: string, nullable: true }
    EmpresaNova:
      type: object
      required: [cnpj, razaoSocial]
      properties:
        cnpj:
          type: string
          example: 11.222.333/0001-81
          description: Com ou sem pontuação; aceita o CNPJ alfanumérico
        razaoSocial: { type: string, minLength: 2, maxLength: 150 }
        nomeFantasia: { type: string, nullable: true }
    EmpresaEditavel:
      type: object
      description: Só para contas de pessoa jurídica. O CNPJ não muda.
      properties:
        razaoSocial: { type: string, minLength: 2, maxLength: 150 }
        nomeFantasia: { type: string, nullable: true }
    NovaConta:
      type: object
      required: [nome, email, senha]
      properties:
        tipoPessoa: { $ref: '#/components/schemas/TipoPessoa' }
        nome: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email }
        cpf: { type: string, nullable: true, example: '52998224725' }
        telefone: { type: string, nullable: true }
        senha: { type: string, format: password, minLength: 8, description: Pelo menos uma letra e um número }
        empresa: { $ref: '#/components/schemas/EmpresaNova' }
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        cpf: { type: string, nullable: true }
        telefone: { type: string, nullable: true }
        perfil: { $ref: '#/components/schemas/Perfil' }
        ativo: { type: boolean }
        email_verificado_em: { type: string, format: date-time, nullable: true }
        ultimo_login_em: { type: string, format: date-time, nullable: true }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        tipo_pessoa: { $ref: '#/components/schemas/TipoPessoa' }
        empresa:
          allOf: [{ $ref: '#/components/schemas/Empresa' }]
          nullable: true
    Erro:
      type: object
      properties:
        erro:
          type: object
          properties:
            codigo: { type: string, example: DADOS_INVALIDOS }
            mensagem: { type: string, example: Verifique os dados enviados. }
            detalhes:
              type: array
              items:
                type: object
                properties:
                  local: { type: string, example: body }
                  campo: { type: string, example: email }
                  mensagem: { type: string, example: E-mail inválido }

  responses:
    DadosInvalidos:
      description: Dados inválidos (DADOS_INVALIDOS), com a lista de erros por campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoAutenticado:
      description: Sem login ou sessão expirada (NAO_AUTENTICADO, SESSAO_EXPIRADA, CREDENCIAIS_INVALIDAS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    AcessoNegado:
      description: Logado, mas sem permissão (ACESSO_NEGADO, CONTA_DESATIVADA)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoEncontrado:
      description: Registro não encontrado (USUARIO_NAO_ENCONTRADO, ESPACO_NAO_ENCONTRADO)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Conflito:
      description: Dado já cadastrado (EMAIL_EM_USO, CPF_EM_USO, CNPJ_EM_USO, ESPACO_DUPLICADO, HORARIO_DUPLICADO)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
